name: Export standalone CSS files

on:
  push:
    branches: [main]
    paths:
      - "snippets.json"
      - "scripts/export-css.mjs"
      - ".github/workflows/export-css.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: css-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate one CSS file per snippet
        run: node scripts/export-css.mjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/
          if git diff --cached --quiet; then
            echo "CSS files are already up to date."
          else
            git commit -m "Generate 1,000 standalone CSS snippets"
            git push origin main
          fi
